# =====================================================================
#  AlertaLar - configuração da aplicação
#  Valores sensíveis vêm de VARIÁVEIS DE AMBIENTE (ou de um arquivo .env
#  na raiz do projeto ou na pasta backend). Veja ../.env.example
# =====================================================================
spring.application.name=alertalar
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# Quando publicado atrás de um proxy reverso (Nginx, Render, Railway...), use "framework"
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ---------------- Banco de dados (PostgreSQL) ----------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alertalar}
spring.datasource.username=${DB_USERNAME:alertalar}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------- Front-end estático ----------------
# Em desenvolvimento serve direto da pasta ../frontend (alterações aparecem sem recompilar).
# No JAR empacotado, o Maven copia o front-end para classpath:/static.
spring.web.resources.static-locations=file:./frontend/,file:../frontend/,classpath:/static/
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------------- Actuator ----------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.com.alertalar=INFO

# =====================================================================
#  Configurações próprias do AlertaLar
# =====================================================================
# E-mail de contato enviado às APIs públicas (exigido pela política do Nominatim)
alertalar.contato-email=${ALERTALAR_CONTATO_EMAIL:}
alertalar.nome-aplicacao=AlertaLar/1.0

# Administrador criado na inicialização (somente se as duas variáveis forem informadas)
alertalar.admin.nome=${ALERTALAR_ADMIN_NOME:Administrador}
alertalar.admin.email=${ALERTALAR_ADMIN_EMAIL:}
alertalar.admin.senha=${ALERTALAR_ADMIN_SENHA:}

# Origens extras liberadas no CORS (separadas por vírgula). Vazio = somente a própria origem.
alertalar.cors.origens-permitidas=${ALERTALAR_CORS_ORIGENS:}

# ---------------- Integrações externas ----------------
alertalar.integracoes.timeout-conexao=5s
alertalar.integracoes.timeout-leitura=25s
alertalar.integracoes.viacep-url=${VIACEP_URL:https://viacep.com.br/ws}
alertalar.integracoes.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
# Política do Nominatim público: no máximo 1 requisição por segundo
alertalar.integracoes.nominatim-intervalo-minimo=1100ms
alertalar.integracoes.ibge-url=${IBGE_URL:https://servicodados.ibge.gov.br/api/v1/localidades}
alertalar.integracoes.overpass-url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
alertalar.integracoes.elevacao-url=${OPEN_METEO_ELEVACAO_URL:https://api.open-meteo.com/v1/elevation}
alertalar.integracoes.previsao-url=${OPEN_METEO_PREVISAO_URL:https://api.open-meteo.com/v1/forecast}
alertalar.integracoes.vazao-url=${OPEN_METEO_VAZAO_URL:https://flood-api.open-meteo.com/v1/flood}
alertalar.integracoes.sgb-setores-risco-url=${SGB_SETORES_RISCO_URL:https://geoportal.sgb.gov.br/server/rest/services/gestaoterritorial/risco/MapServer/0}

# ---------------- Parâmetros da análise de risco ----------------
alertalar.analise.raio-cursos-agua-metros=1500
alertalar.analise.raio-ocorrencias-metros=500
alertalar.analise.raio-setores-risco-metros=300
alertalar.analise.anos-historico=30

# ---------------- Limites de requisições por IP ----------------
alertalar.limites.consultas-por-minuto=15
alertalar.limites.relatos-por-hora=10
alertalar.limites.autenticacao-por-minuto=10
